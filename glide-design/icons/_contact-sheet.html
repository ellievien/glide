<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Glide icon set</title>
<style>
body { margin:0; padding:32px; background:#F4F6FB; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; color:#11182F; }
h1 { font-size:18px; margin:0 0 20px; }
.g { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; }
.c { background:#fff; border:1px solid rgba(17,24,47,0.08); border-radius:16px; padding:18px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:10px; }
.c img { width:28px; height:28px; }
.c span { font-size:12px; color:#5B6272; }
</style></head><body><h1>Glide icon set — 24×24, 1px grid, stroke = currentColor</h1><div class="g"><div class="c"><img src="laptop.svg" alt="laptop"><span>laptop</span></div><div class="c"><img src="phone.svg" alt="phone"><span>phone</span></div><div class="c"><img src="desktop.svg" alt="desktop"><span>desktop</span></div><div class="c"><img src="file.svg" alt="file"><span>file</span></div><div class="c"><img src="folder.svg" alt="folder"><span>folder</span></div><div class="c"><img src="chevron-left.svg" alt="chevron-left"><span>chevron-left</span></div><div class="c"><img src="chevron-right.svg" alt="chevron-right"><span>chevron-right</span></div><div class="c"><img src="close.svg" alt="close"><span>close</span></div><div class="c"><img src="search.svg" alt="search"><span>search</span></div><div class="c"><img src="check.svg" alt="check"><span>check</span></div><div class="c"><img src="arrow-right.svg" alt="arrow-right"><span>arrow-right</span></div><div class="c"><img src="arrow-up-right.svg" alt="arrow-up-right"><span>arrow-up-right</span></div><div class="c"><img src="arrow-down-left.svg" alt="arrow-down-left"><span>arrow-down-left</span></div><div class="c"><img src="pencil.svg" alt="pencil"><span>pencil</span></div><div class="c"><img src="sliders.svg" alt="sliders"><span>sliders</span></div><div class="c"><img src="network.svg" alt="network"><span>network</span></div></div></body></html>
