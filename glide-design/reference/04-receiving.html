<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glide reference 04 — Incoming request</title>
<style>
html, body { margin: 0; min-height: 100%; }
body { background: #E6E9F1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box; }
.frame { border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px rgba(17,24,47,0.18); }

* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="frame">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F6FB; color: #11182F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">

  <img src="../brand/logo/glide-symbol.svg" alt="Glide" style="position: absolute; left: 24px; top: 30px; height: 20px; width: auto; opacity: 0.55;">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 584px; background: #FFFFFF; box-shadow: 0 -8px 30px rgba(17,24,47,0.10); border-radius: 28px 28px 0 0; padding: 14px 24px 28px 24px; display: flex; flex-direction: column;">

    <div style="width: 40px; height: 4px; border-radius: 999px; background: rgba(17,24,47,0.12); margin: 0 auto 24px auto;"></div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 56px; height: 56px; border-radius: 999px; background: rgba(53,92,245,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M2 19h20"></path></svg>
      </div>
      <div>
        <div style="font-size: 16px; font-weight: 600;">Ced's MacBook Pro</div>
        <div style="font-size: 13px; color: #5B6272; margin-top: 2px;">wants to send you a file</div>
      </div>
    </div>

    <div style="margin-top: 22px; padding: 16px; background: #F4F6FB; border: 1px solid rgba(17,24,47,0.06); border-radius: 20px; display: flex; align-items: center; gap: 12px;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path></svg>
      </div>
      <div style="min-width: 0;">
        <div style="font-size: 14px; font-weight: 600;">vacation-photos.zip</div>
        <div style="font-size: 12px; color: #5B6272; margin-top: 2px;">482 MB · 24 photos</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; margin-top: 18px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA0AE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.5a17 17 0 0120 0"></path><path d="M5.5 12.5a12 12 0 0113 0"></path><path d="M9 16.5a7 7 0 016 0"></path><circle cx="12" cy="20" r="1" fill="#9AA0AE" stroke="none"></circle></svg>
      <span style="font-size: 12px; color: #9AA0AE;">Only devices on your network can see this</span>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <button type="button" style="width: 100%; height: 56px; background: #355CF5; color: #FFFFFF; font-weight: 700; font-size: 16px; border: none; border-radius: 16px; box-shadow: 0 10px 24px rgba(53,92,245,0.28);">Accept</button>
      <a href="01-home.html" style="display: block; width: 100%; height: 52px; line-height: 52px; text-align: center; background: transparent; border: 1px solid rgba(17,24,47,0.12); color: #E6484B; border-radius: 16px; font-weight: 600; font-size: 15px;">Decline</a>
    </div>

  </div>
</div>
</div>
</body>
</html>
