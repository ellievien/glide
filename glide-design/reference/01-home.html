<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glide reference 01 — Home</title>
<style>
html, body { margin: 0; min-height: 100%; }
body { background: #E6E9F1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box; }
.frame { border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px rgba(17,24,47,0.18); }

* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
@keyframes radarPing {
  0% { transform: translate(-50%, -50%) scale(0.22); opacity: 0.45; }
  70% { opacity: 0.10; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}
</style>
</head>
<body>
<div class="frame">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F6FB; color: #11182F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 26px 24px 0 24px; position: relative; z-index: 3;">
    <img src="../brand/logo/glide-logo.svg" alt="Glide" style="height: 24px; width: auto; display: block;">
    <a href="06-settings.html" aria-label="Settings" style="width: 36px; height: 36px; border-radius: 12px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 1px 2px rgba(17,24,47,0.05); display: flex; align-items: center; justify-content: center; color: #5B6272;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="2" fill="#FFFFFF"></circle><circle cx="15" cy="12" r="2" fill="#FFFFFF"></circle><circle cx="9" cy="18" r="2" fill="#FFFFFF"></circle></svg>
    </a>
  </div>

  <div style="padding: 30px 30px 0 30px; text-align: center; position: relative; z-index: 3;">
    <div style="font-size: 20px; font-weight: 700; line-height: 1.3;">Open Glide on other devices to send files</div>
    <div style="font-size: 13px; color: #5B6272; margin-top: 8px; line-height: 1.5; padding: 0 8px;">Devices on the same network appear here automatically — nothing goes through the cloud.</div>
  </div>

  <div style="flex: 1; position: relative; min-height: 0;">

    <div style="position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; border-radius: 999px; border: 1px solid rgba(53,92,245,0.16); transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 170px; height: 170px; border-radius: 999px; border: 1px solid rgba(53,92,245,0.13); transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 250px; height: 250px; border-radius: 999px; border: 1px solid rgba(53,92,245,0.11); transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 330px; height: 330px; border-radius: 999px; border: 1px solid rgba(53,92,245,0.09); transform: translate(-50%, -50%);"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 410px; height: 410px; border-radius: 999px; border: 1px solid rgba(53,92,245,0.07); transform: translate(-50%, -50%);"></div>

    <div style="position: absolute; left: 50%; top: 50%; width: 410px; height: 410px; border-radius: 999px; border: 1.5px solid #355CF5; transform: translate(-50%, -50%) scale(0.22); opacity: 0; animation: radarPing 3400ms ease-out infinite;"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 410px; height: 410px; border-radius: 999px; border: 1.5px solid #355CF5; transform: translate(-50%, -50%) scale(0.22); opacity: 0; animation: radarPing 3400ms ease-out infinite; animation-delay: -1700ms;"></div>

    <a href="02-sending.html" aria-label="Send to Ced's MacBook Pro" style="position: absolute; left: 50%; top: 50%; transform: translate(calc(-50% - 141px), calc(-50% - 100px)); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2;">
      <div style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 4px 14px rgba(17,24,47,0.08); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M2 19h20"></path></svg>
      </div>
      <span style="font-size: 11px; font-weight: 600; color: #5B6272;">MacBook Pro</span>
    </a>

    <a href="02-sending.html" aria-label="Send to Pixel 9" style="position: absolute; left: 50%; top: 50%; transform: translate(calc(-50% + 141px), calc(-50% - 100px)); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2;">
      <div style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 4px 14px rgba(17,24,47,0.08); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><line x1="11" y1="18.5" x2="13" y2="18.5"></line></svg>
      </div>
      <span style="font-size: 11px; font-weight: 600; color: #5B6272;">Pixel 9</span>
    </a>

    <a href="02-sending.html" aria-label="Send to Windows PC" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, calc(-50% + 158px)); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 2;">
      <div style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 4px 14px rgba(17,24,47,0.08); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><line x1="8" y1="20" x2="16" y2="20"></line><line x1="12" y1="16" x2="12" y2="20"></line></svg>
      </div>
      <span style="font-size: 11px; font-weight: 600; color: #5B6272;">Windows PC</span>
    </a>

    <div style="position: absolute; left: 50%; top: 50%; width: 96px; height: 96px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(53,92,245,0.18); transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; z-index: 2;">
      <img src="../brand/logo/glide-symbol.svg" alt="Glide" style="width: 38px; height: auto;">
    </div>

  </div>

  <div style="padding: 0 24px 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; z-index: 3;">
    <div style="display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #5B6272;">
      You are known as
      <span style="display: inline-flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 1px 2px rgba(17,24,47,0.05); border-radius: 999px; padding: 5px 6px 5px 14px; font-size: 13px; font-weight: 600; color: #11182F;">
        Ced's MacBook Pro
        <a href="06-settings.html" aria-label="Rename device" style="width: 24px; height: 24px; border-radius: 999px; background: rgba(17,24,47,0.05); display: flex; align-items: center; justify-content: center; color: #5B6272; flex-shrink: 0;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg>
        </a>
      </span>
    </div>
    <a href="06-settings.html" style="display: inline-flex; align-items: center; gap: 8px; background: rgba(53,92,245,0.10); color: #355CF5; padding: 7px 14px 7px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;">
      <span style="width: 8px; height: 8px; border-radius: 999px; background: #355CF5; box-shadow: 0 0 0 4px rgba(53,92,245,0.16);"></span>
      Discoverable by everyone nearby
    </a>
  </div>

</div>
</div>
</body>
</html>
