<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Glide reference 02 — Sending</title>
<style>
html, body { margin: 0; min-height: 100%; }
body { background: #E6E9F1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; box-sizing: border-box; }
.frame { border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px rgba(17,24,47,0.18); }

* { box-sizing: border-box; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
@keyframes glideMove {
  0% { offset-distance: 0%; opacity: 0; }
  6% { opacity: 1; }
  46% { offset-distance: 100%; opacity: 1; }
  54% { opacity: 0; }
  100% { offset-distance: 100%; opacity: 0; }
}
@keyframes fillShimmer {
  0% { opacity: 0.6; }
  50% { opacity: 1; }
  100% { opacity: 0.6; }
}
</style>
</head>
<body>
<div class="frame">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F6FB; color: #11182F; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0 20px;">
    <a href="01-home.html" aria-label="Back" style="width: 36px; height: 36px; border-radius: 12px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 1px 2px rgba(17,24,47,0.05); display: flex; align-items: center; justify-content: center; color: #11182F;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 15px; font-weight: 600;">Sending to Pixel 9</div>
    <button type="button" aria-label="Cancel" style="width: 36px; height: 36px; border-radius: 12px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 1px 2px rgba(17,24,47,0.05); display: flex; align-items: center; justify-content: center; color: #5B6272;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
    </button>
  </div>

  <div style="position: relative; height: 260px; margin: 8px 24px 0 24px;">
    <svg width="342" height="260" viewBox="0 0 342 260" style="position: absolute; top: 0; left: 0;" fill="none">
      <path d="M40,140 Q171,60 302,140" stroke="rgba(53,92,245,0.35)" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round"></path>
    </svg>

    <div style="position: absolute; left: 12px; top: 112px; width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 1px 2px rgba(17,24,47,0.05); display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6272" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"></rect><path d="M2 19h20"></path></svg>
    </div>
    <div style="position: absolute; left: -12px; top: 176px; width: 104px; text-align: center; font-size: 12px; color: #5B6272;">This Mac</div>

    <div style="position: absolute; left: 274px; top: 112px; width: 56px; height: 56px; border-radius: 999px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 1px 2px rgba(17,24,47,0.05); display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B6272" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"></rect><line x1="11" y1="18.5" x2="13" y2="18.5"></line></svg>
    </div>
    <div style="position: absolute; left: 250px; top: 176px; width: 104px; text-align: center; font-size: 12px; color: #5B6272;">Pixel 9</div>

    <div style="position: absolute; top: 0; left: 0; width: 66px; height: 30px; offset-path: path('M40,140 Q171,60 302,140'); offset-rotate: 0deg; transform: scale(0.82); animation: glideMove 2600ms cubic-bezier(0.22,0.61,0.16,1) infinite; animation-delay: -260ms;">
      <div style="width: 100%; height: 100%; border-radius: 10px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.10); display: flex; align-items: center; gap: 5px; padding: 0 8px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path></svg>
        <span style="font-size: 10px; color: #5B6272;">.zip</span>
      </div>
    </div>

    <div style="position: absolute; top: 0; left: 0; width: 66px; height: 30px; offset-path: path('M40,140 Q171,60 302,140'); offset-rotate: 0deg; animation: glideMove 2600ms cubic-bezier(0.22,0.61,0.16,1) infinite; box-shadow: 0 4px 14px rgba(53,92,245,0.30);">
      <div style="width: 100%; height: 100%; border-radius: 10px; background: #FFFFFF; border: 1.5px solid #355CF5; display: flex; align-items: center; gap: 5px; padding: 0 8px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path></svg>
        <span style="font-size: 10px; color: #11182F; font-weight: 600;">.zip</span>
      </div>
    </div>
  </div>

  <div style="margin: 4px 24px 0 24px; padding: 16px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.08); box-shadow: 0 1px 2px rgba(17,24,47,0.04), 0 8px 20px rgba(17,24,47,0.05); border-radius: 20px; display: flex; align-items: center; gap: 12px;">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(53,92,245,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#355CF5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path></svg>
    </div>
    <div style="min-width: 0;">
      <div style="font-size: 14px; font-weight: 600;">vacation-photos.zip</div>
      <div style="font-size: 12px; color: #5B6272; margin-top: 2px;">482 MB</div>
    </div>
  </div>

  <div style="margin: 20px 24px 0 24px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;">68%</div>
      <div style="font-size: 13px; color: #5B6272;">~3s left</div>
    </div>
    <div style="margin-top: 10px; width: 100%; height: 8px; border-radius: 999px; background: rgba(17,24,47,0.08); overflow: hidden;">
      <div style="width: 68%; height: 100%; border-radius: 999px; background: #355CF5; animation: fillShimmer 1600ms ease-in-out infinite;"></div>
    </div>
    <div style="margin-top: 8px; font-size: 13px; color: #5B6272; font-variant-numeric: tabular-nums;">42.8 MB/s average</div>
  </div>

  <div style="margin-top: auto; padding: 0 24px 28px 24px;">
    <button type="button" style="width: 100%; height: 52px; background: #FFFFFF; border: 1px solid rgba(17,24,47,0.12); color: #11182F; border-radius: 16px; font-weight: 600; font-size: 15px;">Cancel transfer</button>
  </div>

</div>
</div>
</body>
</html>
